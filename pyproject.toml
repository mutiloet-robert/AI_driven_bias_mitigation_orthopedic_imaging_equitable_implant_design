[build-system]
requires = ["setuptools==68.2.2", "wheel==0.41.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lbep-equitable-implant-design"
version = "1.0.0"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.1.0",
  "torchvision==0.16.0",
  "numpy==1.26.1",
  "scipy==1.11.3",
  "statsmodels==0.14.0",
  "POT==0.9.1",
  "nibabel==5.1.0",
  "SimpleITK==2.3.0",
  "PyYAML==6.0.1",
  "scikit-learn==1.3.2",
  "pandas==2.1.2"
]

[project.scripts]
lbep = "lbep.entrypoint:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*"]
ignore_missing_imports = true
